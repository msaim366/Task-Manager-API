services:

  postgres:
    image: postgres:16
    container_name: taskdb
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: task-manager
    ports:
      - "8080:8080"
    depends_on:
      - postgres